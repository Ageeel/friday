name: Build Flet APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 1. تثبيت نسخة Flet المحددة
      - name: Install dependencies
        run: |
          pip install flet==0.19.0
          pip install -r requirements.txt

      # 2. إعداد بيئة Flutter (ضرورية جداً لعمل Build للـ APK)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0' # يمكنك تحديث النسخة حسب حاجة flet

      # 3. بناء التطبيق
      - name: Build APK
        run: |
          flet build apk --project "alwafa_app"
          
      # 4. رفع الملف الناتج
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-release
          path: build/apk/app-release.apk
