name: Build Flet APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: python-setup@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install flet==0.19.0
          pip install -r requirements.txt

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Build Flet App
        run: |
          flet build apk

      - name: Fix App Name for Arabic
        run: |
          # نتوجه إلى مجلد الأندرويد الذي أنشأته أداة فليت
          # ونقوم بإنشاء ملف strings.xml لضمان تعريب الاسم
          mkdir -p android/app/src/main/res/values
          echo '<?xml version="1.0" encoding="utf-8"?>' > android/app/src/main/res/values/strings.xml
          echo '<resources>' >> android/app/src/main/res/values/strings.xml
          echo '    <string name="app_name">تطبيق الجمعة</string>' >> android/app/src/main/res/values/strings.xml
          echo '</resources>' >> android/app/src/main/res/values/strings.xml
          
          # إجبار أندرويد على استخدام هذا المورد في ملف AndroidManifest
          sed -i 's/android:label=".*"/android:label="@string\/app_name"/' android/app/src/main/AndroidManifest.xml

      - name: Final Build
        run: |
          # إعادة بناء الـ APK باستخدام الموارد المعدلة
          cd android && ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
