name: Build Flet APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install flet==0.19.0
          pip install -r requirements.txt

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Prepare Assets and Configs
        run: |
          # ننشئ المجلدات يدوياً قبل بناء فليت لضمان وجودها
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          
          # إعداد الاسم العربي
          echo '<?xml version="1.0" encoding="utf-8"?><resources><string name="app_name">تطبيق الجمعة</string></resources>' > android/app/src/main/res/values/strings.xml
          
          # إضافة الأيقونة (تأكد من وجود الملف في مجلد assets/icon.png)
          cp assets/icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Build APK
        run: |
          # أمر فليت يبني التطبيق ويضع المخرجات في المسار الافتراضي
          flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/apk/app-release.apk
